name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # Posit's package manager serves Linux binaries, so the app's
          # dependencies install in a couple of minutes rather than compiling
          # from source. The app itself is not a package, so there is no
          # DESCRIPTION for setup-r-dependencies to read.
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('global.R') }}
          restore-keys: ${{ runner.os }}-r-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          # The same list the app installs at startup, read from global.R so
          # the two cannot drift, plus testthat for the suite itself.
          source("global.R")
          install.packages("testthat")

      - name: Run tests
        run: Rscript tests/run-tests.R
